services:
  glypho-web:
    build:
      context: .
    image: glypho-web:local
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    pids_limit: 64
    mem_limit: 128m
    cpus: 1.0
    ports:
      - 127.0.0.1:46329:8080