name: Build npm native package
run-name: npm ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native npm target to build
        required: true
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - win32-x64
          - win32-arm64

permissions:
  contents: read

concurrency:
  group: npm-native-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      os: ${{ steps.config.outputs.os }}
      features: ${{ steps.config.outputs.features }}
    steps:
      - id: config
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            linux-x64)
              os='ubuntu-24.04'
              features=''
              ;;
            linux-arm64)
              os='ubuntu-24.04-arm'
              features=''
              ;;
            darwin-x64)
              os='macos-15-intel'
              features=''
              ;;
            darwin-arm64)
              os='macos-15'
              features='coreml'
              ;;
            win32-x64)
              os='windows-2025'
              features=''
              ;;
            win32-arm64)
              os='windows-11-arm'
              features=''
              ;;
            *)
              echo "Unknown target: $TARGET" >&2
              exit 2
              ;;
          esac
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "features=$features" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: '24'

      - name: Install Linux build dependencies
        if: startsWith(inputs.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build native runtime
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          FEATURES: ${{ needs.prepare.outputs.features }}
        run: |
          set -euo pipefail
          args=(--release --locked -p glypho-ocr)
          if [[ -n "$FEATURES" ]]; then
            args+=(--features "$FEATURES")
          fi
          if [[ "$TARGET" == darwin-* ]]; then
            export MACOSX_DEPLOYMENT_TARGET=14.0
          fi
          cargo build "${args[@]}"

      - name: Inspect native runtime
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            win32-*)
              test -f target/release/glypho.exe
              test -f target/release/glypho.dll
              ./target/release/glypho.exe --version
              ;;
            darwin-*)
              test -x target/release/glypho
              test -f target/release/libglypho.dylib
              ./target/release/glypho --version
              otool -L target/release/glypho
              otool -L target/release/libglypho.dylib
              ;;
            linux-*)
              test -x target/release/glypho
              test -f target/release/libglypho.so
              ./target/release/glypho --version
              ldd target/release/glypho
              ldd target/release/libglypho.so
              echo 'Highest GLIBC requirements:'
              readelf --version-info target/release/glypho 2>/dev/null \
                | grep -oE 'GLIBC_[0-9.]+' \
                | sort -Vu \
                | tail -n 8 || true
              ;;
          esac

      - name: Stage npm platform package
        shell: bash
        run: python .github/tools/package_native.py '${{ inputs.target }}' --target target/release

      - name: Pack npm packages
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release"
          (cd "npm/$TARGET" && npm pack --pack-destination "$GITHUB_WORKSPACE/release")
          (cd js && npm pack --pack-destination "$GITHUB_WORKSPACE/release")
          ls -lh "$GITHUB_WORKSPACE"/release/*.tgz

      - name: Smoke-test packed Node.js SDK
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: bash .github/tools/smoke_npm.sh "$TARGET" release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glypho-npm-${{ inputs.target }}
          path: release/glypho-ocr-${{ inputs.target }}-*.tgz
