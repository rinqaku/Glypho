name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_HOME: ${{ github.workspace }}/.gh-tmp/cargo-home
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace --remap-path-prefix=${{ github.workspace }}/.gh-tmp=/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python .github/tools/check_versions.py
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: python .github/tools/check_model_registry.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --locked -p glypho-ocr --features openvino
      - run: cargo build --release --locked -p glypho-ocr
      - run: python -m pip install numpy pillow pytest
      - run: PYTHONPATH=python python -m pytest python/tests
      - run: npm test
        working-directory: js
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: docker build --tag glypho-web:release web

  linux:
    name: linux (${{ matrix.artifact }})
    needs: verify
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0536c364004fa2a3c5041120b6fe35d84fc5bfe31f04c6a6304f13eac4a67b63
            artifact: linux-x64
            platform: linux-x64
            # The upstream CUDA provider requires glibc 2.38 and
            # GLIBCXX_3.4.31, whose first matching policy is manylinux 2.39.
            wheel-platform: manylinux_2_39_x86_64
            features: cuda
            package-native: true
            sdist: true
            smoke-wheel: false
          - os: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0536c364004fa2a3c5041120b6fe35d84fc5bfe31f04c6a6304f13eac4a67b63
            artifact: linux-x64-cpu
            platform: linux-x64
            # Preserve broad Linux support instead of raising the CPU wheel's
            # glibc floor to match the optional CUDA provider.
            wheel-platform: manylinux_2_28_x86_64
            features: ''
            package-native: false
            sdist: false
            smoke-wheel: true
          - os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:1676a4f178dc6cf8a1d1e3b7e1d71fca891a466ebde72a33880ccda8af3383d8
            artifact: linux-arm64
            platform: linux-arm64
            wheel-platform: manylinux_2_28_aarch64
            features: ''
            package-native: true
            sdist: false
            smoke-wheel: true
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.gh-tmp/cargo-home
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace --remap-path-prefix=${{ github.workspace }}/.gh-tmp=/tmp
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install manylinux build dependencies
        shell: bash
        run: dnf -y install openssl-devel
      - name: Build portable native runtime
        shell: bash
        run: |
          stdcpp=$(dirname "$(gcc -print-file-name=libstdc++.a)")
          test -f "$stdcpp/libstdc++.a"

          # Keep the main runtime compatible with glibc 2.28. The separately
          # loaded CUDA provider retains its higher upstream ABI floor.
          cat > "$RUNNER_TEMP/glypho_glibc_compat.c" <<'C'
          #include <stdlib.h>
          __attribute__((visibility("hidden"))) char __libc_single_threaded = 0;
          __attribute__((visibility("hidden"))) long __isoc23_strtol(const char *s, char **end, int base) { return strtol(s, end, base); }
          __attribute__((visibility("hidden"))) long long __isoc23_strtoll(const char *s, char **end, int base) { return strtoll(s, end, base); }
          __attribute__((visibility("hidden"))) unsigned long long __isoc23_strtoull(const char *s, char **end, int base) { return strtoull(s, end, base); }
          C
          cc -fPIC -c "$RUNNER_TEMP/glypho_glibc_compat.c" -o "$RUNNER_TEMP/glypho_glibc_compat.o"

          export ORT_CXX_STDLIB='static=stdc++'
          export RUSTFLAGS="$RUSTFLAGS -L native=$stdcpp -C link-arg=$RUNNER_TEMP/glypho_glibc_compat.o"
          args=(--release --locked -p glypho-ocr)
          if [[ -n '${{ matrix.features }}' ]]; then args+=(--features '${{ matrix.features }}'); fi
          cargo build "${args[@]}"
      - name: Build and repair Python wheel
        shell: bash
        env:
          GLYPHO_SKIP_NATIVE_BUILD: '1'
        run: |
          python=/opt/python/cp310-cp310/bin/python
          "$python" -m pip install build==1.3.0 auditwheel==6.8.2
          "$python" -m build --wheel python
          auditwheel_args=(python/dist/*.whl --plat '${{ matrix.wheel-platform }}' --wheel-dir release)
          if [[ '${{ matrix.features }}' == 'cuda' ]]; then
            auditwheel_args+=(
              --exclude libcublasLt.so.13
              --exclude libcublas.so.13
              --exclude libcurand.so.10
              --exclude libcudart.so.13
              --exclude libcuda.so.1
            )
          fi
          "$python" -m auditwheel repair "${auditwheel_args[@]}"
          "$python" -m auditwheel show release/*.whl
      - name: Smoke-test Python wheel
        if: matrix.smoke-wheel
        shell: bash
        run: |
          python=/opt/python/cp310-cp310/bin/python
          "$python" -m pip install --force-reinstall --no-deps release/*.whl
          GLYPHO_HOME="$RUNNER_TEMP/glypho" "$python" -c "from glypho import Glypho; g = Glypho(languages=('en',)); d = g.recognize('.github/fixtures/english.png'); assert d.text == 'The quick brown fox jumps over 13 lazy dogs.'; print(g.info())"
      - name: Build Python source distribution
        if: matrix.sdist
        shell: bash
        run: /opt/python/cp310-cp310/bin/python -m build --sdist python --outdir release
      - name: Stage npm platform package
        if: matrix.package-native
        shell: bash
        run: |
          args=('${{ matrix.platform }}' --target target/release)
          if [[ '${{ matrix.features }}' == 'cuda' ]]; then args+=(--require-cuda); fi
          /opt/python/cp310-cp310/bin/python .github/tools/package_native.py "${args[@]}"
      - name: Pack npm platform package
        if: matrix.package-native
        shell: bash
        run: |
          mkdir -p ../../release
          npm pack --pack-destination ../../release
        working-directory: npm/${{ matrix.platform }}
      - name: Smoke-test packed Node.js SDK
        if: matrix.package-native
        shell: bash
        run: bash .github/tools/smoke_npm.sh '${{ matrix.platform }}' release
      - name: Create CLI archive
        if: matrix.package-native
        shell: bash
        run: |
          args=('${{ matrix.platform }}' --target target/release --archive release)
          if [[ '${{ matrix.features }}' == 'cuda' ]]; then args+=(--require-cuda); fi
          /opt/python/cp310-cp310/bin/python .github/tools/package_native.py "${args[@]}"
      - name: Test CLI installer
        if: matrix.package-native
        shell: bash
        run: |
          GLYPHO_ASSET_DIR="$GITHUB_WORKSPACE/release" \
          GLYPHO_INSTALL_DIR="$RUNNER_TEMP/glypho-bin" \
          ./install.sh
          GLYPHO_HOME="$RUNNER_TEMP/glypho-cli" \
          "$RUNNER_TEMP/glypho-bin/glypho" .github/fixtures/english.png --language en
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glypho-${{ matrix.artifact }}
          path: release/*

  linux-cuda-wheel-smoke:
    name: linux (linux-x64 CUDA wheel smoke)
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: glypho-linux-x64
          path: release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install and smoke-test CUDA wheel
        run: |
          python -m pip install --force-reinstall --no-deps release/*manylinux_2_39_x86_64.whl
          GLYPHO_HOME="$RUNNER_TEMP/glypho" python -c "from glypho import Glypho; g = Glypho(languages=('en',)); d = g.recognize('.github/fixtures/english.png'); assert d.text == 'The quick brown fox jumps over 13 lazy dogs.'; print(g.info())"

  native:
    needs: verify
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            features: coreml
          - os: windows-2025
            platform: win32-x64
            features: cuda
          - os: windows-11-arm
            platform: win32-arm64
            features: ''
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.gh-tmp/cargo-home
      MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.platform, 'darwin') && '14.0' || '' }}
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace --remap-path-prefix=${{ github.workspace }}/.gh-tmp=/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build native runtime
        shell: bash
        run: |
          args=(--release --locked -p glypho-ocr)
          if [[ -n '${{ matrix.features }}' ]]; then args+=(--features '${{ matrix.features }}'); fi
          cargo build "${args[@]}"
      - name: Build Python wheel
        shell: bash
        env:
          GLYPHO_SKIP_NATIVE_BUILD: '1'
        run: |
          python -m pip install build
          python -m build --wheel python
          python -m pip install --force-reinstall --no-deps python/dist/*.whl
          python -c "from glypho import Glypho; g = Glypho(languages=('en',)); d = g.recognize('.github/fixtures/english.png'); assert d.text == 'The quick brown fox jumps over 13 lazy dogs.'; print(g.info())"
          mkdir -p release
          cp python/dist/*.whl release/
      - name: Stage npm platform package
        shell: bash
        run: |
          args=('${{ matrix.platform }}' --target target/release)
          if [[ '${{ matrix.features }}' == 'cuda' ]]; then args+=(--require-cuda); fi
          python .github/tools/package_native.py "${args[@]}"
      - name: Pack npm platform package
        shell: bash
        run: |
          mkdir -p ../../release
          npm pack --pack-destination ../../release
        working-directory: npm/${{ matrix.platform }}
      - name: Smoke-test packed Node.js SDK
        shell: bash
        run: bash .github/tools/smoke_npm.sh '${{ matrix.platform }}' release
      - name: Create CLI archive
        shell: bash
        run: |
          args=('${{ matrix.platform }}' --target target/release --archive release)
          if [[ '${{ matrix.features }}' == 'cuda' ]]; then args+=(--require-cuda); fi
          python .github/tools/package_native.py "${args[@]}"
      - name: Test macOS CLI installer
        if: startsWith(matrix.platform, 'darwin')
        shell: bash
        run: |
          GLYPHO_ASSET_DIR="$GITHUB_WORKSPACE/release" \
          GLYPHO_INSTALL_DIR="$RUNNER_TEMP/glypho-bin" \
          ./install.sh
          "$RUNNER_TEMP/glypho-bin/glypho" .github/fixtures/english.png --offline --language en
      - name: Test Windows CLI installer
        if: startsWith(matrix.platform, 'win32')
        shell: pwsh
        run: |
          $env:GLYPHO_ASSET_DIR = "$env:GITHUB_WORKSPACE\release"
          $env:GLYPHO_INSTALL_DIR = "$env:RUNNER_TEMP\glypho-bin"
          $env:GLYPHO_SKIP_PATH_UPDATE = '1'
          .\install.ps1
          & "$env:RUNNER_TEMP\glypho-bin\glypho.exe" .github/fixtures/english.png --offline --language en
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glypho-${{ matrix.platform }}
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-cuda-wheel-smoke, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: glypho-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Create release checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
      - name: Publish wheels to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install twine
          python -m twine check artifacts/*.whl artifacts/glypho_ocr-*.tar.gz
          python -m twine upload --non-interactive --skip-existing artifacts/*.whl artifacts/glypho_ocr-*.tar.gz
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish npm native packages
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./js/package.json').version")"
          for target in darwin-arm64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            if [[ "$target" == win32-* ]]; then
              name="@rinqaku/glypho-ocr-$target"
              filename="rinqaku-glypho-ocr-$target-$VERSION.tgz"
            else
              name="glypho-ocr-$target"
              filename="$name-$VERSION.tgz"
            fi
            package="$GITHUB_WORKSPACE/artifacts/$filename"
            test -f "$package"
            if npm view "$name@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping"
            else
              npm publish "$package" --access public --provenance
            fi
          done
      - name: Verify npm registry native resolution
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./js/package.json').version")"
          WORK_DIR="$(mktemp -d)"
          PACK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR" "$PACK_DIR"' EXIT
          npm pack ./js --pack-destination "$PACK_DIR" >/dev/null
          cat > "$WORK_DIR/package.json" <<'JSON'
          {"name":"glypho-registry-smoke-test","private":true}
          JSON
          cd "$WORK_DIR"
          npm install --no-audit --no-fund "$PACK_DIR/glypho-ocr-$VERSION.tgz"
          npm ls glypho-ocr-linux-x64
          npx --no-install glypho --version
      - name: Publish npm wrapper
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./js/package.json').version")"
          if npm view "glypho-ocr@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "glypho-ocr@$VERSION is already published; skipping"
          else
            npm publish ./js --access public --provenance
          fi
      - name: Publish Cargo crate if needed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as file:
              print(tomllib.load(file)['workspace']['package']['version'])
          PY
          )"
          if cargo info "glypho-ocr@$VERSION" --registry crates-io >/dev/null 2>&1; then
            echo "glypho-ocr@$VERSION is already published on crates.io; skipping"
          else
            cargo publish -p glypho-ocr --locked
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          fail_on_unmatched_files: true
          files: artifacts/*
          generate_release_notes: true
