[package]
name = 'glypho-ocr'
description = 'Fast multilingual OCR with local ONNX inference and optional hardware acceleration'
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license = 'Apache-2.0'
repository = 'https://github.com/rinqaku/Glypho'
homepage = 'https://glypho.kaneki.cz'
documentation = 'https://docs.rs/glypho-ocr'
readme = 'README.md'
keywords = ['ocr', 'onnx', 'computer-vision', 'text-recognition']
categories = ['computer-vision', 'command-line-utilities']

[lib]
name = 'glypho'
path = 'src/lib.rs'
crate-type = ['rlib', 'cdylib', 'staticlib']

[[bin]]
name = 'glypho'
path = 'src/bin/glypho.rs'

[features]
default = []
cuda = ['oar-ocr/cuda', 'ort/cuda']
coreml = ['oar-ocr/coreml', 'ort/coreml']
# Official ONNX Runtime archives do not include OpenVINO. Load a caller-supplied
# OpenVINO-enabled runtime dynamically instead of producing an unusable link.
openvino = ['oar-ocr/openvino', 'ort/openvino', 'ort/load-dynamic']
accelerated = ['cuda', 'coreml']

[dependencies]
clap = { version = '4.6', features = ['derive'] }
image = { version = '0.25.9', default-features = false, features = ['bmp', 'jpeg', 'png', 'tiff', 'webp'] }
oar-ocr = { version = '0.9.2', default-features = false, features = ['download-binaries', 'simd'] }
ort = { version = '=2.0.0-rc.13', default-features = false, features = ['std'] }
serde = { version = '1.0', features = ['derive'] }
serde_json = '1.0'
sha2 = '0.10'
ureq = { version = '3.4', default-features = false, features = ['rustls'] }

[target.'cfg(unix)'.dependencies]
libc = '0.2'
